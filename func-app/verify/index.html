<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>func — presence &amp; visibility rule check</title>
<style>
  body { font: 14px/1.5 ui-monospace, Menlo, monospace; background: #0b0f12; color: #d6e2e8; padding: 24px; }
  h1 { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: #8fa3ad; }
  .pass { color: #46ffb4; } .fail { color: #ff6b7d; }
  table { border-collapse: collapse; margin-top: 16px; }
  td, th { padding: 3px 10px; text-align: left; border-bottom: 1px solid #1b2429; }
  #summary { font-size: 18px; margin: 16px 0; }
</style>
</head>
<body>
<h1>func — presence &amp; visibility rule check</h1>
<div id="summary">running…</div>
<div id="detail"></div>
<script src="rules-check.js"></script>
<script>
  var r = window.__RULES_RESULT__;
  document.getElementById('summary').innerHTML =
    '<span class="' + (r.failed ? 'fail' : 'pass') + '">' +
    r.passed + ' / ' + r.total + ' passed' +
    (r.failed ? ' — ' + r.failed + ' FAILED' : '') + '</span>';
  var rows = r.failures.map(function (f) {
    return '<tr><td class="fail">FAIL</td><td>' + f.name +
      '</td><td>got ' + JSON.stringify(f.actual) +
      ', want ' + JSON.stringify(f.expected) + '</td></tr>';
  }).join('');
  document.getElementById('detail').innerHTML = rows ? '<table>' + rows + '</table>' : '';
</script>
</body>
</html>
